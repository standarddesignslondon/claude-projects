<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Reckoner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #0a0a0a;
  --bg-elevated: #141414;
  --bg-input: #1a1a1a;
  --fg: #e8e6e0;
  --fg-muted: #888580;
  --fg-dim: #5a5752;
  --accent: #d97757;
  --accent-dim: #8a4a32;
  --border: #262624;
  --border-bright: #3a3835;
  --tag-bg: #1f1d1a;
  --tag-fg: #b8b3a8;
  --subcat-chip-bg: #1a1815;
  --shadow: rgba(0,0,0,0.4);
}

[data-theme="light"] {
  --bg: #f5f3ee;
  --bg-elevated: #ffffff;
  --bg-input: #ffffff;
  --fg: #1a1815;
  --fg-muted: #6b6660;
  --fg-dim: #9a948c;
  --accent: #c5552d;
  --accent-dim: #e88a6a;
  --border: #d8d3c8;
  --border-bright: #b8b2a4;
  --tag-bg: #ebe7dd;
  --tag-fg: #4a4640;
  --subcat-chip-bg: #ece8df;
  --shadow: rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter Tight', sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}
::selection { background: var(--accent); color: var(--bg); }

/* ============ HEADER ============ */
.header {
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem 2rem 2rem;
  border-bottom: 1px solid var(--border);
}
.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.title {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(2.2rem, 5vw, 4rem);
  letter-spacing: -0.04em;
  line-height: 0.95;
  font-variation-settings: "opsz" 144;
}
.title em {
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
}
.subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--fg-muted);
  margin-top: 0.5rem;
}
.header-actions {
  display: flex;
  gap: 0.5rem;
}
.btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 0.5rem 1rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.2s ease;
  border-radius: 2px;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.btn.primary:hover {
  background: transparent;
  color: var(--accent);
}

/* ============ CONTROLS ============ */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
}
.search-row {
  display: flex;
  gap: 1rem;
  align-items: center;
}
.search-box {
  flex: 1;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 0.875rem 1rem 0.875rem 2.75rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s ease;
  border-radius: 2px;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--fg-dim); }
.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--fg-dim);
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  display: none;
}
.search-clear:hover { color: var(--accent); }
.search-clear.visible { display: block; }
.counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  white-space: nowrap;
}
.counter strong {
  color: var(--accent);
  font-weight: 700;
}

/* Filter chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: center;
}
.chip-group-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--fg-dim);
  margin-right: 0.3rem;
}
.chip {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg-muted);
  padding: 0.35rem 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.15s ease;
  border-radius: 2px;
  white-space: nowrap;
}
.chip:hover {
  border-color: var(--border-bright);
  color: var(--fg);
}
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 500;
}

/* Sub-category chips have a slightly different look */
.subchips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: center;
  padding-top: 0.6rem;
  border-top: 1px dashed var(--border);
  animation: slideDown 0.25s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.subchips.hidden { display: none; }
.subchip {
  background: var(--subcat-chip-bg);
  border: 1px solid transparent;
  color: var(--fg-muted);
  padding: 0.3rem 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  cursor: pointer;
  transition: all 0.15s ease;
  border-radius: 12px;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.subchip:hover {
  color: var(--fg);
  border-color: var(--border-bright);
}
.subchip.active {
  background: var(--accent);
  color: var(--bg);
  font-weight: 500;
}

/* ============ QUICK PICK BANNER ============ */
.quickpick-banner {
  max-width: 1400px;
  margin: 1rem auto 0;
  padding: 0 2rem;
  display: none;
}
.quickpick-banner.visible { display: block; animation: slideDown 0.3s ease; }
.quickpick-banner-inner {
  background: linear-gradient(95deg, var(--accent) 0%, var(--accent-dim) 100%);
  color: var(--bg);
  padding: 1rem 1.25rem;
  border-radius: 2px;
  display: flex;
  align-items: center;
  gap: 1rem;
  box-shadow: 0 4px 20px var(--shadow);
}
[data-theme="light"] .quickpick-banner-inner {
  background: linear-gradient(95deg, var(--accent) 0%, #a04420 100%);
  color: #fff;
}
.qp-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  opacity: 0.85;
  white-space: nowrap;
  border-right: 1px solid currentColor;
  padding-right: 1rem;
  font-weight: 500;
}
.qp-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.qp-q {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1.05rem;
  line-height: 1.2;
}
.qp-a {
  font-family: 'Inter Tight', sans-serif;
  font-size: 0.85rem;
  opacity: 0.95;
  line-height: 1.35;
}
.qp-actions {
  display: flex;
  gap: 0.3rem;
}
.qp-btn {
  background: transparent;
  border: 1px solid currentColor;
  color: inherit;
  padding: 0.4rem 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.15s ease;
  border-radius: 2px;
  white-space: nowrap;
}
.qp-btn:hover {
  background: rgba(255,255,255,0.2);
}

/* ============ MAIN ============ */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}
.category-section {
  margin-bottom: 3.5rem;
  scroll-margin-top: 240px;
}
.category-section.empty { display: none; }
.category-header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--fg);
}
.category-header h2 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.7rem;
  letter-spacing: -0.02em;
  font-variation-settings: "opsz" 72;
}
.category-header .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-left: auto;
}
.category-header.parent-cat { border-bottom: 1px solid var(--accent); }
.category-header.parent-cat h2 {
  color: var(--accent);
  font-style: italic;
  font-weight: 500;
}

/* Subcategory header within a category */
.subcat-group { margin-bottom: 1.5rem; }
.subcat-group.empty { display: none; }
.subcat-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--fg-muted);
  margin-bottom: 0.6rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px dashed var(--border);
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}
.subcat-header .subcat-count {
  font-size: 0.6rem;
  color: var(--fg-dim);
  margin-left: auto;
}

.plugin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 0;
}
.plugin {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  transition: background 0.15s ease;
}
.plugin:hover { background: var(--bg-elevated); }
.plugin.hidden { display: none; }
.plugin-name {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  font-size: 0.85rem;
  color: var(--fg);
  line-height: 1.3;
}
.plugin-name .manufacturer {
  color: var(--fg-dim);
  font-weight: 400;
}
.plugin-desc {
  font-size: 0.85rem;
  color: var(--fg-muted);
  line-height: 1.45;
}
.plugin-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.15rem;
}
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tag-fg);
  background: var(--tag-bg);
  padding: 0.15rem 0.5rem;
  border-radius: 2px;
}
.tag.also { opacity: 0.65; }

.plugin-name mark,
.plugin-desc mark {
  background: var(--accent);
  color: var(--bg);
  padding: 0 2px;
  border-radius: 1px;
  font-weight: 500;
}

.no-results {
  display: none;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--fg-muted);
}
.no-results.visible { display: block; }
.no-results h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
  font-style: italic;
}
.no-results p {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

/* ============ JUMP NAV ============ */
.jump-nav {
  position: fixed;
  right: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  display: none;
  flex-direction: column;
  gap: 0.3rem;
  z-index: 5;
  background: var(--bg-elevated);
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  max-height: 70vh;
  overflow-y: auto;
}
@media (min-width: 1600px) { .jump-nav { display: flex; } }
.jump-nav a {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--fg-muted);
  text-decoration: none;
  padding: 0.2rem 0.4rem;
  transition: color 0.15s ease;
}
.jump-nav a:hover { color: var(--accent); }
.jump-nav a.parent {
  color: var(--accent);
  font-style: italic;
  font-weight: 500;
  margin-top: 0.4rem;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 0.3rem;
}
.jump-nav a.parent:first-child { margin-top: 0; }

/* ============ FOOTER ============ */
.footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem 2rem;
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  text-align: center;
}

@media (max-width: 768px) {
  .header { padding: 2rem 1rem 1rem; }
  .controls { padding: 1rem; }
  .main { padding: 1rem; }
  .quickpick-banner { padding: 0 1rem; }
  .quickpick-banner-inner { flex-direction: column; align-items: flex-start; }
  .qp-label { border-right: none; padding-right: 0; }
  .plugin-grid { grid-template-columns: 1fr; }
}
</style>
</head>

// ============================================================
// HELPERS
// ============================================================
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function highlightMatch(text, query) {
  if (!query) return escapeHTML(text);
  const safe = escapeHTML(text);
  const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${safeQuery})`, 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}
function slug(s) {
  return s.replace(/[\s·\/]+/g, '-').toLowerCase();
}
function getGroup(category) {
  for (const [group, cats] of Object.entries(CATEGORY_GROUPS)) {
    if (cats.includes(category)) return group;
  }
  return "OTHER";
}
function subcategoriesFor(category) {
  // Preserve discovery order from PLUGINS array
  const seen = new Set();
  const ordered = [];
  for (const p of PLUGINS) {
    if (p.category === category && !seen.has(p.subcategory)) {
      seen.add(p.subcategory);
      ordered.push(p.subcategory);
    }
  }
  return ordered;
}

// ============================================================
// STATE
// ============================================================
let currentSearch = "";
let currentMainFilter = "all";   // "all", group name (INSTRUMENTS/EFFECTS/UTILITY), or specific category
let currentSubFilter = "all";    // "all" or a specific subcategory
let qpHistory = [];               // recently shown picks (avoid repeats)

// ============================================================
// MATCHING
// ============================================================
function matchesSearch(plugin, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return (
    plugin.name.toLowerCase().includes(q) ||
    plugin.manufacturer.toLowerCase().includes(q) ||
    plugin.category.toLowerCase().includes(q) ||
    plugin.subcategory.toLowerCase().includes(q) ||
    plugin.desc.toLowerCase().includes(q) ||
    (plugin.also && plugin.also.some(t => t.toLowerCase().includes(q)))
  );
}

function matchesMainFilter(plugin, filter) {
  if (filter === "all") return true;
  // Group name?
  for (const [group, cats] of Object.entries(CATEGORY_GROUPS)) {
    if (filter === group && cats.includes(plugin.category)) return true;
  }
  // Specific category
  return plugin.category === filter;
}

function matchesSubFilter(plugin, subFilter) {
  if (subFilter === "all") return true;
  return plugin.subcategory === subFilter;
}

// ============================================================
// CHIPS — MAIN ROW (top-level groups + key categories)
// ============================================================
function buildChips() {
  const chips = $("#chips");

  // Top-level groups
  for (const group of Object.keys(CATEGORY_GROUPS)) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.cat = group;
    btn.dataset.level = "group";
    btn.textContent = group;
    chips.appendChild(btn);
  }

  // Separator
  const sep = document.createElement("span");
  sep.style.cssText = "color: var(--fg-dim); padding: 0 0.3rem;";
  sep.textContent = "|";
  chips.appendChild(sep);

  // Top sub-category chips (most-reached-for top-level categories)
  const topCats = ["Reverb", "Delay", "Distortion", "Tape/Lo-fi", "Synth · Analog", "Sampler", "Multi-FX", "Creative"];
  for (const cat of topCats) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.cat = cat;
    btn.dataset.level = "main";
    btn.textContent = cat;
    chips.appendChild(btn);
  }

  chips.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    $$(".chip", chips).forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentMainFilter = chip.dataset.cat;
    currentSubFilter = "all";  // reset sub-filter when changing main
    buildSubChips();
    render();
  });
}

// ============================================================
// CHIPS — SUB ROW (appears when a specific category is active)
// ============================================================
function buildSubChips() {
  const subchips = $("#subchips");
  subchips.innerHTML = "";

  // Only show sub-chips when a SPECIFIC category is selected (not "all" or a group)
  const isSpecificCategory = (
    currentMainFilter !== "all" &&
    !Object.keys(CATEGORY_GROUPS).includes(currentMainFilter)
  );

  if (!isSpecificCategory) {
    subchips.classList.add("hidden");
    return;
  }

  const subs = subcategoriesFor(currentMainFilter);
  if (subs.length <= 1) {
    // Only one sub-category — don't bother showing the row
    subchips.classList.add("hidden");
    return;
  }

  // Label
  const label = document.createElement("span");
  label.className = "chip-group-label";
  label.textContent = `${currentMainFilter}:`;
  subchips.appendChild(label);

  // "All" sub-chip
  const allBtn = document.createElement("button");
  allBtn.className = "subchip active";
  allBtn.dataset.sub = "all";
  allBtn.textContent = "All";
  subchips.appendChild(allBtn);

  for (const sub of subs) {
    const btn = document.createElement("button");
    btn.className = "subchip";
    btn.dataset.sub = sub;
    btn.textContent = sub;
    subchips.appendChild(btn);
  }

  subchips.classList.remove("hidden");

  // Delegated click
  subchips.onclick = e => {
    const sc = e.target.closest(".subchip");
    if (!sc) return;
    $$(".subchip", subchips).forEach(c => c.classList.remove("active"));
    sc.classList.add("active");
    currentSubFilter = sc.dataset.sub;
    render();
  };
}

// ============================================================
// BUILD RESULTS (initial DOM structure)
// ============================================================
function buildResults() {
  const results = $("#results");
  results.innerHTML = "";

  // Group: top-level group → category → subcategory → plugins
  const grouped = {};
  for (const p of PLUGINS) {
    const g = getGroup(p.category);
    if (!grouped[g]) grouped[g] = {};
    if (!grouped[g][p.category]) grouped[g][p.category] = {};
    if (!grouped[g][p.category][p.subcategory]) grouped[g][p.category][p.subcategory] = [];
    grouped[g][p.category][p.subcategory].push(p);
  }

  const renderOrder = [...Object.keys(CATEGORY_GROUPS), "OTHER"];

  for (const group of renderOrder) {
    if (!grouped[group]) continue;

    const parentSection = document.createElement("section");
    parentSection.className = "category-section parent-section";
    parentSection.id = `group-${group.toLowerCase()}`;

    const parentHeader = document.createElement("div");
    parentHeader.className = "category-header parent-cat";
    parentHeader.innerHTML = `<h2>${group}</h2>`;
    parentSection.appendChild(parentHeader);

    const orderedCats = group === "OTHER"
      ? Object.keys(grouped[group])
      : CATEGORY_GROUPS[group].filter(c => grouped[group][c]);

    for (const cat of orderedCats) {
      const catData = grouped[group][cat];
      if (!catData) continue;

      const subSection = document.createElement("section");
      subSection.className = "category-section";
      subSection.dataset.category = cat;
      subSection.id = `cat-${slug(cat)}`;

      const subHeader = document.createElement("div");
      subHeader.className = "category-header";
      subHeader.innerHTML = `<h2>${cat}</h2><span class="count" data-count></span>`;
      subSection.appendChild(subHeader);

      // For each subcategory within this category, create a group
      const orderedSubs = subcategoriesFor(cat);
      for (const sub of orderedSubs) {
        const subPlugins = catData[sub];
        if (!subPlugins) continue;

        const subGroup = document.createElement("div");
        subGroup.className = "subcat-group";
        subGroup.dataset.subcategory = sub;

        const subHdr = document.createElement("div");
        subHdr.className = "subcat-header";
        subHdr.innerHTML = `<span>${sub}</span><span class="subcat-count" data-subcount></span>`;
        subGroup.appendChild(subHdr);

        const grid = document.createElement("div");
        grid.className = "plugin-grid";

        for (const plugin of subPlugins) {
          const item = document.createElement("article");
          item.className = "plugin";
          item.dataset.name = plugin.name.toLowerCase();
          item.dataset.manufacturer = plugin.manufacturer.toLowerCase();
          item.dataset.category = plugin.category;
          item.dataset.subcategory = plugin.subcategory;
          item.dataset.desc = plugin.desc.toLowerCase();
          item.dataset.also = (plugin.also || []).join(",").toLowerCase();

          const alsoTags = (plugin.also || [])
            .map(t => `<span class="tag also">${escapeHTML(t)}</span>`)
            .join("");

          item.innerHTML = `
            <div class="plugin-name">
              <span class="plugin-name-text">${escapeHTML(plugin.name)}</span>
              <span class="manufacturer"> · ${escapeHTML(plugin.manufacturer)}</span>
            </div>
            <div class="plugin-desc">${escapeHTML(plugin.desc)}</div>
            ${alsoTags ? `<div class="plugin-tags">${alsoTags}</div>` : ""}
          `;
          grid.appendChild(item);
        }
        subGroup.appendChild(grid);
        subSection.appendChild(subGroup);
      }

      parentSection.appendChild(subSection);
    }
    results.appendChild(parentSection);
  }
}

// ============================================================
// RENDER (apply current filter/search to DOM)
// ============================================================
function render() {
  const query = currentSearch.toLowerCase().trim();
  let visibleCount = 0;

  // Update each plugin's visibility
  for (const plugin of PLUGINS) {
    const matchingEls = $$(`article.plugin[data-name="${CSS.escape(plugin.name.toLowerCase())}"][data-manufacturer="${CSS.escape(plugin.manufacturer.toLowerCase())}"][data-category="${CSS.escape(plugin.category)}"]`);
    // There should only be one matching DOM element (we group by category strictly), but defend just in case
    for (const el of matchingEls) {
      const visible = matchesSearch(plugin, query)
                   && matchesMainFilter(plugin, currentMainFilter)
                   && matchesSubFilter(plugin, currentSubFilter);

      if (visible) {
        visibleCount++;
        el.classList.remove("hidden");
        if (query) {
          const nameEl = el.querySelector(".plugin-name-text");
          const descEl = el.querySelector(".plugin-desc");
          if (nameEl) nameEl.innerHTML = highlightMatch(plugin.name, query);
          if (descEl) descEl.innerHTML = highlightMatch(plugin.desc, query);
        } else {
          const nameEl = el.querySelector(".plugin-name-text");
          const descEl = el.querySelector(".plugin-desc");
          if (nameEl) nameEl.textContent = plugin.name;
          if (descEl) descEl.textContent = plugin.desc;
        }
      } else {
        el.classList.add("hidden");
      }
    }
  }

  // Hide empty sub-groups and update their counts
  $$(".subcat-group").forEach(group => {
    const visiblePlugins = $$("article.plugin:not(.hidden)", group);
    const countEl = $("[data-subcount]", group);
    if (countEl) countEl.textContent = visiblePlugins.length;
    if (visiblePlugins.length === 0) {
      group.classList.add("empty");
    } else {
      group.classList.remove("empty");
    }
  });

  // Hide empty category sections and update counts
  $$(".category-section[data-category]").forEach(section => {
    const visiblePlugins = $$("article.plugin:not(.hidden)", section);
    const countEl = $("[data-count]", section);
    if (countEl) countEl.textContent = `${visiblePlugins.length} plugins`;
    if (visiblePlugins.length === 0) {
      section.classList.add("empty");
    } else {
      section.classList.remove("empty");
    }
  });

  // Hide empty parent sections
  $$(".parent-section").forEach(section => {
    const visibleSubs = $$(".category-section:not(.empty)[data-category]", section);
    if (visibleSubs.length === 0) {
      section.classList.add("empty");
    } else {
      section.classList.remove("empty");
    }
  });

  $("#counterNum").textContent = visibleCount;
  $("#counterTotal").textContent = PLUGINS.length;
  $("#noResults").classList.toggle("visible", visibleCount === 0);
  $("#searchClear").classList.toggle("visible", query.length > 0);
}

// ============================================================
// QUICK PICK (random reroll)
// ============================================================
function showRandomPick() {
  // Avoid repeating the last few picks
  const recentLimit = Math.min(8, Math.floor(QUICK_PICKS.length / 2));
  let available = QUICK_PICKS.filter(p => !qpHistory.slice(-recentLimit).includes(p.q));
  if (available.length === 0) available = QUICK_PICKS;

  const choice = available[Math.floor(Math.random() * available.length)];
  qpHistory.push(choice.q);

  $("#qpQ").textContent = choice.q;
  $("#qpA").textContent = choice.a;
  $("#quickpickBanner").classList.add("visible");
}

function hideQuickPick() {
  $("#quickpickBanner").classList.remove("visible");
}

// ============================================================
// JUMP NAV
// ============================================================
function buildJumpNav() {
  const nav = $("#jumpNav");
  for (const group of Object.keys(CATEGORY_GROUPS)) {
    const a = document.createElement("a");
    a.href = `#group-${group.toLowerCase()}`;
    a.textContent = group;
    a.className = "parent";
    nav.appendChild(a);
    for (const cat of CATEGORY_GROUPS[group]) {
      const hasPlugins = PLUGINS.some(p => p.category === cat);
      if (!hasPlugins) continue;
      const link = document.createElement("a");
      link.href = `#cat-${slug(cat)}`;
      link.textContent = cat;
      nav.appendChild(link);
    }
  }
}

// ============================================================
// THEME
// ============================================================
function setupTheme() {
  const btn = $("#themeToggle");
  const stored = localStorage.getItem("reckonerTheme") || "dark";
  document.body.dataset.theme = stored;
  btn.innerHTML = stored === "dark" ? "◐ Light" : "◑ Dark";
  btn.addEventListener("click", () => {
    const next = document.body.dataset.theme === "dark" ? "light" : "dark";
    document.body.dataset.theme = next;
    localStorage.setItem("reckonerTheme", next);
    btn.innerHTML = next === "dark" ? "◐ Light" : "◑ Dark";
  });
}

// ============================================================
// SEARCH
// ============================================================
function setupSearch() {
  const input = $("#search");
  const clear = $("#searchClear");
  input.addEventListener("input", e => {
    currentSearch = e.target.value;
    render();
  });
  clear.addEventListener("click", () => {
    input.value = "";
    currentSearch = "";
    render();
    input.focus();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
    if (e.key === "Escape" && document.activeElement === input) {
      input.value = "";
      currentSearch = "";
      render();
    }
  });
}

// ============================================================
// QUICK PICK BUTTONS
// ============================================================
function setupQuickPick() {
  $("#diceBtn").addEventListener("click", showRandomPick);
  $("#qpReroll").addEventListener("click", showRandomPick);
  $("#qpClose").addEventListener("click", hideQuickPick);
}

// ============================================================
// INIT
// ============================================================
buildChips();
buildSubChips();
buildResults();
buildJumpNav();
setupTheme();
setupSearch();
setupQuickPick();
render();
